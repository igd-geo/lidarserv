[package]
name = "lidarserv-input-ros"
version = "0.1.0"
edition = "2024"

[dependencies]
human-panic = "2.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4.14"
simple_logger = "5.0"
pasture-core.workspace = true
pasture-io.workspace = true
anyhow = "1.0"
nalgebra.workspace = true
tokio = { version = "1.28", features = ["full"] }
lidarserv-server = { path = "../lidarserv-server" }
lidarserv-common = { path = "../lidarserv-common" }
bytemuck = "1.17"
thiserror = "2.0"
rosrust = "0.9.12"
ctrlc = "3.4.5"
byteorder = "1.5"
console = "0.15"
r2r ={ version = "0.9.5", optional = true }
futures = { version = "*", optional = true }

[features]

# Add support for ros2 via the r2r crate.
# You must source your ros environment when enabling this feature.
ros2 = ["r2r", "futures"]